[pytest]
testpaths = cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    v1_mode: V1 mode tests
    w4a8: W4A8 quantization tests
    vl_model: VL model tests
    expert_parallel: Expert Parallel tests
    ep4tp4: EP4TP4 tests
    ep4tp1: EP4TP1 tests
    all2all: all2all tests

# Default options
addopts = -v -s --tb=short

# Timeout settings (requires pytest-timeout)
timeout = 1800
timeout_method = signal

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
