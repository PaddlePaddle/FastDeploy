name: CI_XPU

on:
  # Repository is no longer maintained: automatic triggers are disabled.
  # pull_request:
  #   types: [closed]
  #   branches: [develop, release/**]
  workflow_dispatch:
permissions: read-all

concurrency:
  group: ${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  cancel:
    name: Cancel CI_XPU for ${{ github.event.pull_request.number }}
    runs-on:
      group: APPROVAL
    steps:
      - name: Cleanup
        run: |
          rm -rf * .[^.]*
      - name: Cancel CI_XPU
        run: |
          exit 0
