#      FASTDEPLOY_WHEEL_URL: ${{ needs.build.outputs.wheel_path }}
#      MODEL_CACHE_DIR: "/ssd2/actions-runner/ModelData"

  images_build:
    name: Run FD Image Build
    needs: [clone,build]
    runs-on: [self-hosted, h20-1567421-01]
    env:
      FD_WHL_PATH: ${{ needs.build.outputs.wheel_path }}
      FASTDEPLOY_ARCHIVE_URL: ${{ needs.clone.outputs.repo_archive_url }}
    steps:
      - name: Images Build
        shell: bash
        env:
          docker_image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleqa:fastdeploy-ciuse-cuda126-dailyupdate
          fd_archive_url: ${{ env.FASTDEPLOY_ARCHIVE_URL }}
        run: |
          set -x
          echo "FD_WHL_PATH = '${{ needs.build.outputs.wheel_path }}'"
          echo "needs.clone.outputs.repo_archive_url = '${{ needs.clone.outputs.repo_archive_url }}'"
          echo "FASTDEPLOY_ARCHIVE_URL = '${FASTDEPLOY_ARCHIVE_URL}'"
          echo "fd_archive_url = '${fd_archive_url}'"

          FULL_REPO="${{ github.repository }}"
          REPO_NAME="${FULL_REPO##*/}"

          # Clean the repository directory before starting
          docker run --rm --net=host -v $(pwd):/workspace -w /workspace \
          -e "REPO_NAME=${REPO_NAME}" \
          ${docker_image} /bin/bash -c '
            if [ -d ${REPO_NAME} ]; then
              echo "Directory ${REPO_NAME} exists, removing it..."
              rm -rf ${REPO_NAME}*
            fi
          '
          wget -q --no-proxy ${fd_archive_url}
          tar -xf FastDeploy.tar.gz
          rm -rf FastDeploy.tar.gz
          ls -l FastDeploy

  images_build_debug:
    name: Run FD Image Build Debug
    needs: [clone]
    runs-on: [self-hosted, h20-1567421-01]
    steps:
      - name: Images Build
        shell: bash
        env:
          docker_image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleqa:fastdeploy-ciuse-cuda126-dailyupdate
        run: |
          export fd_archive_url = ${{ needs.clone.outputs.repo_archive_url }}
          echo "FASTDEPLOY_ARCHIVE_URL = '${FASTDEPLOY_ARCHIVE_URL}'"

          FULL_REPO="${{ github.repository }}"
          REPO_NAME="${FULL_REPO##*/}"

          # Clean the repository directory before starting
          docker run --rm --net=host -v $(pwd):/workspace -w /workspace \
          -e "REPO_NAME=${REPO_NAME}" \
          ${docker_image} /bin/bash -c '
            if [ -d ${REPO_NAME} ]; then
              echo "Directory ${REPO_NAME} exists, removing it..."
              rm -rf ${REPO_NAME}*
            fi
          '
          wget -q --no-proxy ${fd_archive_url}
          tar -xf FastDeploy.tar.gz
          rm -rf FastDeploy.tar.gz
          ls -l FastDeploy

