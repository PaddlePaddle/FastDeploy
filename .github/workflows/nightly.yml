name: Nightly FastDeploy Build

on:
  workflow_dispatch:
  schedule:
    # Trigger at 03:00 AM China Standard Time (CST)
    - cron: '0 19 * * *'

jobs:
  build:
    runs-on: [self-hosted, GPU-L20-4Card]
    steps:
      - name: Code Clone
        shell: bash
        env:
          docker_image: "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleqa:cuda126-py310"
        run: |
            REPO="https://github.com/${{ github.repository }}.git"
            FULL_REPO="${{ github.repository }}"
            REPO_NAME="${FULL_REPO##*/}"
            # Clean the repository directory before starting
            docker run --rm --net=host -v $(pwd):/workspace -w /workspace \
            -e "REPO_NAME=${REPO_NAME}" \
            ${docker_image} /bin/bash -c '
              if [ -d ${REPO_NAME} ]; then
                echo "Directory ${REPO_NAME} exists, removing it..."
                rm -rf ${REPO_NAME}
              fi
            '
            git config --global user.name "FastDeployCI"
            git config --global user.email "fastdeploy_ci@example.com"
            git clone ${REPO} ${REPO_NAME}
            cd FastDeploy
            git checkout ${{ github.sha }}
            git log -n 3 --oneline

      - name: Run FastDeploy Build Plugin
        id: build_step
        uses: ./.github/actions/fastdeploy-build-gpu
        with:
          DOCKER_IMAGE: "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleqa:cuda126-py310"
          COMPILE_ARCH: "80,90"
          FD_VERSION: "2.0.0"
          WITH_NIGHTLY_BUILD: "ON"
      - name: Show build result
        run: |
          echo "Built wheel path: ${{ steps.build_step.outputs.wheel_path }}"
          ls -ll ${{ steps.build_step.outputs.wheel_path }}

