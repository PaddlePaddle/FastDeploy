codecov:
  notify:
    wait_for_ci: false

coverage:
  status:
    project:
      default:
        target: 30% # overall project Coverage
        threshold: 1% # Allow the coverage to drop by 1%, and posting a success status.
    patch:
      default:
        target: 80% # lines adjusted  Coverage < 80%  CI will fail
  fixes:
    - "/workspace/FastDeploy/::FastDeploy/"
    - "/home/runner/work/FastDeploy/FastDeploy/::FastDeploy/"

comment:
  behavior: new

ignore:
  - "**/site-packages/**"
