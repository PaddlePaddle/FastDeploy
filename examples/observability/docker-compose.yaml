version: '1.0'
services:
  prometheus:
    image: iregistry.baidu-int.com/lmep-observability/prometheus:latest
    container_name: prometheus
    ports: # 使用端口映射，宿主机:容器
      - "9090:9090"
    volumes:
      - ./metrics/prometheus.yaml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: iregistry.baidu-int.com/lmep-observability/grafana:latest
    container_name: grafana
    ports: # 使用端口映射，宿主机 8084 映射到容器内部 3000
      - "8084:3000"
    volumes:
      - ./metrics/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./metrics/grafana/dashboards/config:/etc/grafana/provisioning/dashboards
      - ./metrics/grafana/dashboards/json:/var/lib/grafana/dashboards
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_BASIC_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/fastdeploy-dashboard.json
    depends_on:
      - prometheus

  jaeger:
    image: iregistry.baidu-int.com/lmep-observability/jaeger-all-in-one:latest
    container_name: jaeger
    ports:
      - "8083:16686" # Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  otel-collector:
    image: iregistry.baidu-int.com/lmep-observability/otel-collector:latest
    volumes:
      - ./tracing/opentelemetry.yaml:/etc/otelcol/config.yaml
      - /tmp:/tmp
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger
      - prometheus
    restart: unless-stopped
